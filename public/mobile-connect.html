<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Base Energy</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif}main{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 20%,#073b9b 0,#020817 42%,#000 100%)}section{width:min(100%,390px);padding:32px 22px;border:1px solid #168cff;border-radius:30px;text-align:center;background:rgba(2,13,38,.94);box-shadow:0 0 60px rgba(0,82,255,.45)}.orb{width:70px;height:70px;margin:0 auto 18px;display:grid;place-items:center;border-radius:22px;background:linear-gradient(#36b8ff,#0052ff);font-size:30px;box-shadow:0 0 30px #087dff}p{margin:0;color:#69dfff;font-size:10px;font-weight:900;letter-spacing:.25em}h1{margin:10px 0;font-size:30px;letter-spacing:.12em}#status{display:block;min-height:38px;color:#b9d7ff;font-size:12px;font-weight:900;letter-spacing:.08em}button{width:100%;min-height:64px;margin-top:18px;border:1px solid #65d7ff;border-radius:22px;background:linear-gradient(#168cff,#0052ff);color:#fff;font-size:14px;font-weight:900;letter-spacing:.1em;touch-action:manipulation}a{display:block;margin-top:22px;color:#72cfff;font-size:11px;font-weight:900;letter-spacing:.12em;text-decoration:none}
  </style>
</head>
<body><main><section><div class="orb">⚡</div><p>BASE BOING BATTLE</p><h1>BASE ENERGY</h1><span id="status">CONNECT BASE WALLET</span><button id="connect" type="button">CONNECT BASE WALLET</button><a href="/mobile">BACK TO GAME</a></section></main><script src="/mobile-wallet.js"></script></body>
</html>
